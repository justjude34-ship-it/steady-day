<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Steady Day</title>
<style>
body{margin:0;background:#0a0a0c;color:#9aa0a6;font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{text-align:center;padding:24px;max-width:360px}
</style>
</head>
<body>
<div class="box" id="boot">Loading Steady Day…</div>
<script>
(async function () {
  var n = 3;
  var parts = [];
  try {
    for (var i = 0; i < n; i++) {
      var res = await fetch('p' + i + '.txt', { cache: 'no-store' });
      if (!res.ok) throw new Error('part ' + i);
      parts.push(await res.text());
    }
    var b64 = parts.join('');
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
    var ds = new DecompressionStream('gzip');
    var stream = new Response(bytes).body.pipeThrough(ds);
    var html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('boot').innerHTML =
      '<p><strong style="color:#e8eaed">Could not load Steady Day</strong></p>' +
      '<p>Open this page in Chrome (GitHub Pages HTTPS), not a chat preview.</p>' +
      '<p style="font-size:12px">' + (e && e.message ? e.message : e) + '</p>';
  }
})();
</script>
</body>
</html>
